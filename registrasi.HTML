<!DOCTYPE html>
<html>
<head>
    <title>Form Registrasi</title>
</head>
<body>

<div style="width:300px; margin:auto; border:1px solid black; padding:20px;">
    <h2 align="left">FORM REGISTRASI</h2>

    <!-- action diarahkan ke login.html -->
    <form action="login.html">
        Nama Lengkap : <br>
        <input type="text" name="nama" required><br><br>

        Email : <br>
        <input type="email" name="email" required><br><br>

        Username : <br>
        <input type="text" name="username" required><br><br>

        Password : <br>
        <input type="password" name="password" required><br><br>

        <input type="submit" value="Daftar">
    </form>

    <p>
        Sudah punya akun?
        <a href="index(1).html">Login di sini</a>
    </p>
</div>

</body>
</html>
